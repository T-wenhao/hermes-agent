name: Release Desktop Clients

on:
  push:
    branches: [custom/home]
  workflow_dispatch:
    inputs:
      ref:
        description: Source branch, tag or commit to build
        default: custom/home
        type: string
      platforms:
        description: Installers to build (automatic Home pushes build Mac only)
        default: mac
        type: choice
        options: [mac, windows, both]
      release_tag:
        description: Optional release tag; empty generates a version and source commit tag
        type: string

concurrency:
  group: release-desktop-clients
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  source:
    if: github.repository == 'T-wenhao/hermes-agent'
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      branch: ${{ steps.source.outputs.branch }}
      version: ${{ steps.source.outputs.version }}
      release_tag: ${{ steps.source.outputs.release_tag }}
      matrix: ${{ steps.source.outputs.matrix }}
    steps:
      - name: Resolve the selected source once
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'push' && github.sha || inputs.ref || 'custom/home' }}
      - id: source
        name: Pin source, version and installer platforms
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BRANCH: ${{ github.ref_name }}
          PLATFORMS: ${{ inputs.platforms || 'mac' }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          commit="$(git rev-parse HEAD)"
          branch="$(git symbolic-ref --short -q HEAD || true)"
          if [[ "$EVENT_NAME" == push ]]; then branch="$EVENT_BRANCH"; fi
          version="$(node -p "require('./apps/desktop/package.json').version")"
          channel="${branch//\//-}"
          tag="${REQUESTED_TAG:-desktop-${channel:-manual}-v${version}-${commit:0:12}}"
          [[ "$tag" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]] || { echo 'Invalid release tag'; exit 1; }
          case "$PLATFORMS" in
            mac) matrix='{"include":[{"os":"macos-latest","platform":"mac","artifact":"apps/desktop/release/*.dmg"}]}' ;;
            windows) matrix='{"include":[{"os":"windows-latest","platform":"windows","artifact":"apps/desktop/release/*.exe"}]}' ;;
            both) matrix='{"include":[{"os":"macos-latest","platform":"mac","artifact":"apps/desktop/release/*.dmg"},{"os":"windows-latest","platform":"windows","artifact":"apps/desktop/release/*.exe"}]}' ;;
            *) echo 'Invalid installer platform'; exit 1 ;;
          esac
          {
            printf 'commit=%s\n' "$commit"
            printf 'branch=%s\n' "$branch"
            printf 'version=%s\n' "$version"
            printf 'release_tag=%s\n' "$tag"
            printf 'matrix=%s\n' "$matrix"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build installer (${{ matrix.platform }})
    needs: source
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.source.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.source.outputs.commit }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: npm
      - name: Install locked workspace dependencies
        shell: bash
        run: |
          npm install -g npm@12.0.0
          npm ci
      - name: Verify the client approval protocol and build metadata
        shell: bash
        run: |
          npm exec -- vitest run apps/shared/src/json-rpc-channel.test.ts
          cd apps/desktop
          npm exec -- vitest run scripts/write-build-stamp.test.mjs src/app/session/hooks/use-message-stream/gateway-event/server-requests.test.ts src/components/assistant-ui/tool/approval.test.tsx
      - name: Build the pinned installer
        working-directory: apps/desktop
        shell: bash
        env:
          SOURCE_COMMIT: ${{ needs.source.outputs.commit }}
          SOURCE_BRANCH: ${{ needs.source.outputs.branch }}
          PLATFORM: ${{ matrix.platform }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          set -euo pipefail
          # npm must see the selected source identity, not the manual event's SHA.
          # This also supports selected refs with older build scripts.
          export GITHUB_SHA="$SOURCE_COMMIT"
          export GITHUB_REF_NAME="$SOURCE_BRANCH"
          npm run build
          if [[ "$PLATFORM" == mac ]]; then
            npm run builder -- --mac dmg --arm64 -c.mac.identity=-
            codesign --verify --deep --strict release/mac-arm64/Hermes.app
          else
            npm run builder -- --win nsis --x64
          fi
      - name: Verify packaged source identity and save the receipt
        working-directory: apps/desktop
        shell: bash
        env:
          SOURCE_COMMIT: ${{ needs.source.outputs.commit }}
          SOURCE_BRANCH: ${{ needs.source.outputs.branch }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict'
          import {readFileSync, writeFileSync} from 'node:fs'
          const {PLATFORM, SOURCE_COMMIT, SOURCE_BRANCH} = process.env
          const resources = PLATFORM === 'mac' ? 'release/mac-arm64/Hermes.app/Contents/Resources' : 'release/win-unpacked/resources'
          const stamp = JSON.parse(readFileSync(`${resources}/install-stamp.json`, 'utf8'))
          assert.equal(stamp.commit, SOURCE_COMMIT)
          assert.equal(stamp.branch ?? '', SOURCE_BRANCH)
          assert.equal(stamp.source, 'ci')
          assert.equal(stamp.dirty, false)
          const version = JSON.parse(readFileSync('package.json', 'utf8')).version
          writeFileSync(`release/desktop-${PLATFORM}-build.json`, JSON.stringify({...stamp, version, platform: PLATFORM, run: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`}, null, 2))
          JS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installer-${{ matrix.platform }}
          path: |
            ${{ matrix.artifact }}
            apps/desktop/release/desktop-*-build.json
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish verified installers
    needs: [source, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.source.outputs.commit }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: installer-*
          merge-multiple: true
          path: installers
      - name: Publish a source-specific pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.source.outputs.release_tag }}
          SOURCE_COMMIT: ${{ needs.source.outputs.commit }}
          SOURCE_BRANCH: ${{ needs.source.outputs.branch }}
          VERSION: ${{ needs.source.outputs.version }}
        run: |
          set -euo pipefail
          cat > release-notes.md <<NOTES
          Hermes Desktop ${VERSION}, built from ${SOURCE_BRANCH:-detached source} at ${SOURCE_COMMIT}.

          Approval protocol tests and packaged source metadata checks passed. The platform build receipts are included with the installers.

          Build: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          macOS packages use ad-hoc signing (no Apple Developer ID or notarization).
          NOTES
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            target="$(gh release view "$RELEASE_TAG" --json targetCommitish --jq .targetCommitish)"
            [[ "$target" == "$SOURCE_COMMIT" ]] || { echo 'Refusing to replace a release for a different source commit'; exit 1; }
          else
            gh release create "$RELEASE_TAG" --target "$SOURCE_COMMIT" --prerelease --title "Hermes Desktop ${VERSION} (${SOURCE_BRANCH:-manual})" --notes-file release-notes.md
          fi
          gh release upload "$RELEASE_TAG" installers/* --clobber
