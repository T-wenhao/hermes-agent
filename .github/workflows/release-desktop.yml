name: Release Desktop Clients

on:
  push:
    branches: [custom/home]
  workflow_dispatch:
    inputs:
      source_ref:
        description: Upgraded Home/DITT branch, tag or commit to build
        default: custom/home
        type: string
      platforms:
        description: Installers to build (automatic Home pushes build both platforms)
        default: both
        type: choice
        options: [mac, windows, both]
      release_tag:
        description: Optional release tag; empty generates a version and source commit tag
        type: string

concurrency:
  group: release-desktop-clients
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  source:
    if: github.repository == 'T-wenhao/hermes-agent'
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      branch: ${{ steps.source.outputs.branch }}
      bootstrap_branch: ${{ steps.source.outputs.bootstrap_branch }}
      version: ${{ steps.source.outputs.version }}
      release_tag: ${{ steps.source.outputs.release_tag }}
      matrix: ${{ steps.source.outputs.matrix }}
    steps:
      - name: Load the release controller from the workflow revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          path: .release-controller
          sparse-checkout: |
            apps/desktop/scripts
            apps/desktop/fork-release.json
          sparse-checkout-cone-mode: false
      - name: Resolve the selected source once
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'push' && github.sha || inputs.source_ref || 'custom/home' }}
          path: source
          fetch-depth: 0
      - id: source
        name: Pin source, version and installer platforms
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BRANCH: ${{ github.ref_name }}
          EVENT_SHA: ${{ github.sha }}
          PLATFORMS: ${{ inputs.platforms || 'both' }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: node .release-controller/apps/desktop/scripts/fork-release.mjs source source

  build:
    name: Build installer (${{ matrix.platform }})
    needs: source
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.source.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.source.outputs.commit }}
          path: source
      - name: Load the same release controller
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          path: .release-controller
          sparse-checkout: |
            apps/desktop/scripts
            apps/desktop/fork-release.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: source/package-lock.json
      - name: Prepare the locked Python for native packaging helpers
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == Windows ]]; then bootstrap=python; else bootstrap=python3; fi
          "$bootstrap" -S scripts/ci/setup_toolchain.py prepare --toolchain python --home "$RUNNER_TEMP/fork-pm"
          "$bootstrap" -S scripts/ci/setup_toolchain.py install --toolchain python --home "$RUNNER_TEMP/fork-pm"
      - name: Install locked workspace dependencies
        shell: bash
        run: |
          npm install -g npm@12.0.0
          npm ci
      - name: Verify the client approval protocol and build metadata
        shell: bash
        run: |
          node --test ../.release-controller/apps/desktop/scripts/fork-release.node-test.mjs
          npm exec -- vitest run apps/shared/src/json-rpc-channel.test.ts
          cd apps/desktop
          npm exec -- vitest run scripts/write-build-stamp.test.mjs electron/bootstrap-runner.test.ts electron/bootstrap-runner-git-binary.test.ts scripts/prepare-dmgbuild.test.mjs src/app/session/hooks/use-message-stream/gateway-event/server-requests.test.ts src/components/assistant-ui/tool/approval.test.tsx
      - name: Build the pinned installer
        working-directory: source/apps/desktop
        shell: bash
        env:
          SOURCE_COMMIT: ${{ needs.source.outputs.commit }}
          SOURCE_BRANCH: ${{ needs.source.outputs.branch }}
          SOURCE_VERSION: ${{ needs.source.outputs.version }}
          SOURCE_BOOTSTRAP_BRANCH: ${{ needs.source.outputs.bootstrap_branch }}
          PLATFORM: ${{ matrix.platform }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          set -euo pipefail
          # npm must see the selected source identity, not the manual event's SHA.
          # This also supports selected refs with older build scripts.
          export GITHUB_SHA="$SOURCE_COMMIT"
          export GITHUB_REF_NAME="$SOURCE_BRANCH"
          export HERMES_PAYLOAD_VERSION="$SOURCE_VERSION"
          export HERMES_BUILD_SOURCE_REPOSITORY='T-wenhao/hermes-agent'
          export HERMES_BUILD_SOURCE_BRANCH="$SOURCE_BOOTSTRAP_BRANCH"
          npm run build
          if [[ "$PLATFORM" == mac ]]; then
            npm run builder -- --mac dmg --arm64 -c.mac.identity=- "-c.extraMetadata.version=$SOURCE_VERSION"
            codesign --verify --deep --strict release/mac-arm64/Hermes.app
          else
            npm run builder -- --win msix zip --x64 "-c.extraMetadata.version=$SOURCE_VERSION"
          fi
      - name: Verify packaged source identity and save the receipt
        working-directory: source
        shell: bash
        env:
          SOURCE_COMMIT: ${{ needs.source.outputs.commit }}
          SOURCE_BRANCH: ${{ needs.source.outputs.branch }}
          SOURCE_VERSION: ${{ needs.source.outputs.version }}
          SOURCE_BOOTSTRAP_BRANCH: ${{ needs.source.outputs.bootstrap_branch }}
          PLATFORM: ${{ matrix.platform }}
        run: node ../.release-controller/apps/desktop/scripts/fork-release.mjs receipt .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installer-${{ matrix.platform }}
          path: |
            source/apps/desktop/release/*.dmg
            source/apps/desktop/release/*.msix
            source/apps/desktop/release/*.zip
            source/apps/desktop/release/desktop-*-build.json
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish verified installers
    needs: [source, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.source.outputs.commit }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: installer-*
          merge-multiple: true
          path: installers
      - name: Publish a source-specific pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.source.outputs.release_tag }}
          SOURCE_COMMIT: ${{ needs.source.outputs.commit }}
          SOURCE_BRANCH: ${{ needs.source.outputs.branch }}
          VERSION: ${{ needs.source.outputs.version }}
        run: |
          set -euo pipefail
          cat > release-notes.md <<NOTES
          Hermes Desktop ${VERSION}, built from ${SOURCE_BRANCH:-detached source} at ${SOURCE_COMMIT}.

          Approval protocol tests and packaged source metadata checks passed. The platform build receipts are included with the installers.

          Build: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          macOS packages use ad-hoc signing (no Apple Developer ID or notarization).
          Windows MSIX packages are unsigned; the portable ZIP is included for manual use. These are source-client packages without a bundled Python runtime. Native installation and startup have not been verified by this workflow.
          NOTES
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            target="$(gh release view "$RELEASE_TAG" --json targetCommitish --jq .targetCommitish)"
            [[ "$target" == "$SOURCE_COMMIT" ]] || { echo 'Refusing to replace a release for a different source commit'; exit 1; }
          else
            gh release create "$RELEASE_TAG" --target "$SOURCE_COMMIT" --prerelease --title "Hermes Desktop ${VERSION} (${SOURCE_BRANCH:-manual})" --notes-file release-notes.md
          fi
          gh release upload "$RELEASE_TAG" installers/* --clobber
